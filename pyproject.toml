[project]
name = "mowerseg"
version = "0.2.0"
description = "Hardware-agnostic lawn-mower perception runtime (Task × Model × Backend)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "transformers>=4.44.0",
  "pillow",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "pyyaml",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mowerseg = "mowerseg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mowerseg*"]

[tool.setuptools.package-data]
mowerseg = ["models/configs/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
